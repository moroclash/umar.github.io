<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 30+ | The Journey Continues</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0d17;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      width: 90%;
    }
    .badge {
      display: inline-block;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 3px;
      color: #6366f1;
      font-weight: 700;
      margin-bottom: 1rem;
      padding: 6px 16px;
      background: rgba(99, 102, 241, 0.1);
      border-radius: 20px;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }
    .counter-wrapper {
      font-size: 5rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .pulse-plus {
      color: #6366f1;
      -webkit-text-fill-color: #6366f1;
      display: inline-block;
      animation: pulse 1.5s infinite alternate ease-in-out;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: -0.5px;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.875rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .indicator {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      display: inline-block;
      margin-right: 8px;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 12px #6366f1); }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <main class="container">
    <span class="badge">Milestone Unlocked</span>
    <div class="counter-wrapper">
      <span id="counter">0</span><span class="pulse-plus">+</span>
    </div>
    <h1>30 Years & Still Compounding</h1>
    <p>30 years of experience loaded into main memory. System optimized, energy steady, and expanding into new horizons.</p>
    
    <div class="status-bar">
      <div><span class="indicator"></span>Status: Active & Growing</div>
      <div style="color: #6366f1; font-weight: 600;">v3.0.1</div>
    </div>
  </main>

  <script>
    // Counter Animation
    const counterElement = document.getElementById('counter');
    const target = 30;
    const duration = 2000;
    const start = performance.now();

    function updateCounter(currentTime) {
      const elapsed = currentTime - start;
      const progress = Math.min(elapsed / duration, 1);
      
      // Ease out expo formula
      const current = Math.floor(progress === 1 ? target : target * (1 - Math.pow(2, -10 * progress)));
      counterElement.textContent = current;

      if (progress < 1) {
        requestAnimationFrame(updateCounter);
      }
    }
    requestAnimationFrame(updateCounter);

    // Particle Canvas Background
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      particles = [];
      const particleCount = Math.floor((width * height) / 15000);

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2 + 1,
          vx: (Math.random() - 0.5) * 0.5,
          vy: -Math.random() * 0.8 - 0.2, // Continuous upward motion
          alpha: Math.random() * 0.5 + 0.2
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        // Reset particles at bottom when they float off top
        if (p.y < 0) {
          p.y = height;
          p.x = Math.random() * width;
        }
        if (p.x < 0 || p.x > width) p.vx *= -1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(165, 180, 252, ${p.alpha})`;
        ctx.fill();
      });

      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    animate();
  </script>
</body>
</html>
